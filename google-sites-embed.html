<style>
  #vocab-steps{font:18px Arial,sans-serif;color:#17211e;background:#fbfaf4;max-width:850px;margin:auto;padding:28px;box-sizing:border-box}#vocab-steps *{box-sizing:border-box}#vocab-steps h1,#vocab-steps h2{font-family:Georgia,serif;line-height:1.1}#vocab-steps h1{font-size:clamp(36px,6vw,58px);margin:8px 0 18px}#vocab-steps h2{font-size:38px}#vocab-steps .hidden{display:none!important}#vocab-steps .eyebrow{font:700 12px monospace;letter-spacing:.12em;color:#145c47}#vocab-steps .intro,#vocab-steps .muted{color:#52625b;line-height:1.5}#vocab-steps .setup{margin:25px 0}#vocab-steps h3{font-size:16px;margin:22px 0 8px}#vocab-steps .choices-row,#vocab-steps .list-choices{display:flex;gap:10px;flex-wrap:wrap}#vocab-steps .card,#vocab-steps .choices-row label{border:1px solid #c9d2cb;border-radius:5px;background:#fff;padding:10px 13px;cursor:pointer}#vocab-steps .card{min-width:190px}#vocab-steps input[type=radio]{accent-color:#145c47}#vocab-steps small{display:block;color:#62736a;margin:4px 0 0 22px;font-size:13px}#vocab-steps button{border:0;border-radius:4px;padding:12px 18px;background:#145c47;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}#vocab-steps button:hover{background:#0e4636}#vocab-steps input[type=text]{padding:12px;border:1px solid #9faca4;border-radius:4px;font-size:16px;min-width:280px}#vocab-steps form{display:flex;gap:9px;flex-wrap:wrap}#vocab-steps .bar{height:8px;border-radius:8px;background:#dfe6df;margin:20px 0 34px}#vocab-steps .bar i{display:block;height:100%;width:0;background:#e2633b;border-radius:inherit}#vocab-steps .answers{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:650px}#vocab-steps .answers button{background:#fff;color:#17211e;border:1px solid #c9d2cb;text-align:left}#vocab-steps .feedback{margin:18px 0;padding:13px;border-left:5px solid #145c47;background:#e4efe8}#vocab-steps .wrong{border-color:#e2633b;background:#fff0e9}@media(max-width:550px){#vocab-steps .answers{grid-template-columns:1fr}}
</style>
<div id="vocab-steps">
  <section data-page="home"><p class="eyebrow">STUDY SETUP</p><h1>Choose your<br>next challenge.</h1><p class="intro">Pick a list and how you want to practice. Missed words return later after we show the correct answer.</p><div class="setup"><h3>Vocabulary list</h3><div class="list-choices"></div><h3>Answer with</h3><div class="choices-row"><label><input type="radio" name="vs-direction" value="word" checked> Vocabulary word<small>See the definition</small></label><label><input type="radio" name="vs-direction" value="definition"> Definition<small>See the word</small></label></div><h3>Answer style</h3><div class="choices-row"><label><input type="radio" name="vs-style" value="typing" checked> Type my answer</label><label><input type="radio" name="vs-style" value="multiple"> Multiple choice</label></div><h3>Study length</h3><div class="choices-row"><label><input type="radio" name="vs-length" value="complete" checked> Finish list in order<small>Default · complete every word</small></label><label><input type="radio" name="vs-length" value="endless"> Endless mode<small>Random five-word sets</small></label></div></div><button data-start>Start a set</button><p class="muted">5 questions per set</p></section>
  <section data-page="quiz" class="hidden"><p class="eyebrow" data-progress></p><div class="bar"><i></i></div><h2 data-prompt-word></h2><p data-prompt></p><form data-form><input type="text" autocomplete="off" required><button>Check answer</button></form><div data-answers class="answers hidden"></div><div data-feedback class="feedback hidden"></div><button data-next class="hidden">Next word</button></section>
  <section data-page="done" class="hidden"><p class="eyebrow" data-done-label></p><h1 data-done-title></h1><p class="intro" data-done-text></p><button data-again></button></section><p class="muted">Vocab updated by Gavin Vukan</p>
</div>
<script>
(()=>{const r=document.querySelector('#vocab-steps'),q=s=>r.querySelector(s),qa=s=>[...r.querySelectorAll(s)],W12=[
['palindrome','a word or phrase which reads the same backward and forward'],['adage','an old saying now accepted as being truthful'],['hackneyed','made common by overuse'],['lurid','glowing through haze; shocking; sensational'],['throe','spasm or pang'],['edify','to instruct and improve the mind'],['vitiate','to spoil; to cause moral weakness'],['eminence','a lofty place; superiority'],['vehement','using great force; described by strong feelings'],['astringent','harsh, biting'],['chary','cautious'],['untoward','unfortunate'],['educe','to draw out'],['whet','to sharpen by rubbing; to stimulate'],['relegate','1. to assign to an inferior position; 2. to commit to an action'],['lucid','1. shiny; 2. clear-minded'],['hone','1. something to sharpen; 2. to sharpen'],['coy','1. modest; bashful; 2. pretending shyness to attract'],['effervescence','1. liveliness; spirit; enthusiasm; 2. bubbliness'],['fervid','1. intensely hot; 2. impassioned'],['imperious','1. arrogant; 2. urgent'],['miscreant','an evil person; villain'],['chafe','to annoy; to irritate'],['duress','1. imprisonment; 2. the use of threats']],W3=[['goad','to push into action'],['ideology','representative way of thinking'],['salient','noticeable'],['recluse','solitary; a person who lives in seclusion'],['censure','a strong expression of disapproval'],['servile','a slave-like manner'],['prattle','to babble while speaking'],['auspicious','successful'],['fathom','to understand'],['covetous','eagerly desirous'],['malign','to speak evil of'],['pensive','engaged in deep thought']],W_RHET=[['Rhetorical Triangle','a diagram that illustrates the interrelationship among the speaker, audience, and subject in a determining text.'],['Ethos','Speakers appeal to demonstrate that they are credible and trustworthy'],['Occasion','The time and place a speech is given or a piece is written.'],['Rhetoric','The faculty of observing in any given case the available means of persuasion.'],['Context','The circumstances, atmosphere, attitudes and events surrounding a text.'],['Connotation','Meanings that readers have with a word beyond its dictionary definition.'],['Concession','An acknowledgement that an opposing argument may be true or reasonable.'],['Speaker','The person or group who creates a text.'],['Audience','The listener, viewer or reader of a text.'],['Counterargument','An opposing argument to the one a writer is putting forward.'],['Diction','A writer\'s choice of words.'],['Logos','Greek for "embodied thought". Speakers appeal to reason by offering clear and rational ideas.'],['Polemic','Greek for "hostile". An aggressive argument that tries to establish the superiority of one opinion.'],['Propaganda','The spread of ideas and information to further a cause.'],['Denotation','The literal definition of a word.'],['Clauses','A group of words containing both a subject and a verb.'],['Exigence','The spark that elicited the speaker\'s message.'],['Formal Diction','Writing that sticks to grammatical rules and avoids slang expressions.'],['Figurative Language','Words or phrases that are not intended to be taken literally and usually involve comparisons.'],['Rebut','A contrasting perspective on an argument or its evidence.'],['Purpose','The goal the speaker wants to achieve.'],['Tone','Choices in diction, syntax and figures of speech all build up over the course of a text to create an overall impression.'],['Shifts','A point in a text that indicates a change.'],['Informal Diction','a conversational form of communication.'],['Metaphor','Figure of speech that compares two things without using like or as.'],['Persona','Greek for mask. The face or character a speaker shows to his or her audience.'],['Subject','The topic or message of a text.'],['WECAMPT','a mnemonic device that helps people remember the various elements of a rhetorical situation.'],['Refutation','a denial of the validity of an opposing argument.'],['Pathos','an appeal involving human emotions.'],['Parallel Structure','The repeating of the same word, clause or phrase for emphasis.'],['Syntax','The arrangement of words into phrases, clauses and sentences.'],['Allusion','A brief reference to a person, place, event or work of art.'],['Analogy','A comparison between two seemingly dissimilar things.'],['Hyperbole','an exaggeration of dramatic overstatement used to create a comedic or an ironic effect.']],make=(id,name,desc,items)=>({id,name,desc,words:items.map(([word,definition])=>({id:word,word,definition}))}),lists=[make('weeks12','Mr.Trumble weeks 1-2','24 vocabulary words',W12),make('week3','Mr.Trumble week 3','12 vocabulary words',W3),make('weeks13','Mr.Trumble weeks 1-3','All 36 vocabulary words',W12.concat(W3)),make('rhetoric','Rhetorical Terms','35 vocabulary words',W_RHET)];let list,questions=[],current=0,mastered=0,set=1,nextWord=0,batch=0,endless=false,dir='word',style='typing';const clean=x=>String(x).trim().toLowerCase(),shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},show=x=>qa('[data-page]').forEach(e=>e.classList.toggle('hidden',e.dataset.page!==x)),answer=w=>dir==='word'?w.word:w.definition,prompt=w=>dir==='word'?w.definition:w.word;
q('.list-choices').innerHTML=lists.map((x,i)=>`<label class="card"><input type="radio" name="vs-list" value="${x.id}" ${i?'':'checked'}><strong>${x.name}</strong><small>${x.desc}</small></label>`).join('');function begin(){list=lists.find(x=>x.id===q('[name=vs-list]:checked').value);dir=q('[name=vs-direction]:checked').value;style=q('[name=vs-style]:checked').value;endless=q('[name=vs-length]:checked').value==='endless';set=1;nextWord=0;start()}function start(){questions=endless?shuffle(list.words).slice(0,5):list.words.slice(nextWord,nextWord+5);while(endless&&questions.length<5)questions.push(list.words[Math.floor(Math.random()*list.words.length)]);batch=questions.length;current=mastered=0;show('quiz');draw()}function draw(){let w=questions[current];q('[data-progress]').textContent=`SET ${set} · ${mastered} OF ${batch} MASTERED`;q('.bar i').style.width=`${mastered/batch*100}%`;q('[data-prompt-word]').textContent=prompt(w);q('[data-prompt]').textContent=dir==='word'?'Which vocabulary word matches this definition?':'What does this vocabulary word mean?';q('[data-feedback]').classList.add('hidden');q('[data-next]').classList.add('hidden');if(style==='typing'){q('[data-form]').classList.remove('hidden');q('[data-answers]').classList.add('hidden');let i=q('[data-form] input');i.value='';i.placeholder=dir==='word'?'Type the vocabulary word…':'Type the definition…';i.focus()}else{q('[data-form]').classList.add('hidden');let options=shuffle([answer(w),...shuffle(list.words.filter(x=>x.id!==w.id)).slice(0,3).map(answer)]);let box=q('[data-answers]');box.innerHTML=options.map(x=>`<button>${x}</button>`).join('');box.classList.remove('hidden');qa('[data-answers] button').forEach(b=>b.onclick=()=>grade(b.textContent))}}function grade(x){let w=questions[current],ok=clean(x)===clean(answer(w));if(ok)mastered++;else questions.push(w);q('[data-form]').classList.add('hidden');q('[data-answers]').classList.add('hidden');let f=q('[data-feedback]');f.className=`feedback ${ok?'':'wrong'}`;f.innerHTML=ok?'<strong>Correct!</strong> Nice work.':`<strong>Not quite.</strong> The correct answer is: ${answer(w)}<br><small>You will see this word again before the set is complete.</small>`;q('[data-next]').textContent=ok&&mastered===batch?'Finish set':'Next word';q('[data-next]').classList.remove('hidden')}function done(){if(!endless)nextWord+=batch;let final=!endless&&nextWord>=list.words.length;q('[data-done-label]').textContent=final?'LIST COMPLETE':'SET COMPLETE';q('[data-done-title]').textContent=final?'You mastered the list.':'Excellent work.';q('[data-done-text]').textContent=final?`You answered all ${list.words.length} words in ${list.name} correctly.`:endless?'Ready for a fresh random set?':`${Math.min(nextWord,list.words.length)} of ${list.words.length} words completed. Continue with the next five words.`;q('[data-again]').textContent=final?'Back to home':endless?'Start next random set':`Start set ${set+1}`;q('[data-again]').dataset.final=final;show('done')}q('[data-start]').onclick=begin;q('[data-form]').onsubmit=e=>{e.preventDefault();grade(q('[data-form] input').value)};q('[data-next]').onclick=()=>{if(++current===questions.length)done();else draw()};q('[data-again]').onclick=()=>{if(q('[data-again]').dataset.final==='true')show('home');else{set++;start()}};r.addEventListener('keydown',e=>{if(e.key==='Enter'&&!q('[data-next]').classList.contains('hidden')){e.preventDefault();q('[data-next]').click()}})})();
</script>
